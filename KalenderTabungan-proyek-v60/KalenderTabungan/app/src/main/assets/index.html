.logo{width:24px;height:24px;flex:none;display:block}

.fire-on .flm .e2{animation:fe 2s ease-in-out .7s infinite}
@keyframes fo{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.98,1.04) skewX(-1.6deg)}65%{transform:scale(1.02,.97) skewX(1.3deg)}}
@keyframes fm{0%,100%{transform:scale(1,1)}50%{transform:scale(.96,1.06)}}
@keyframes fc{from{transform:scale(.93,.9);opacity:.88}to{transform:scale(1.06,1.1);opacity:1}}
@keyframes fe{0%,100%{transform:translateY(0) scale(1);opacity:1}50%{transform:translateY(-14%) scale(.78);opacity:.45}}
.fire-card{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:18px 18px 20px;margin-bottom:12px}
.fire-top{display:flex;align-items:center;gap:18px;min-height:140px}
.fire-fl{position:relative;flex:none;width:112px;height:134px;display:grid;place-items:end center}
.fire-fl .flm{position:relative;z-index:1}
.fire-glow{position:absolute;left:50%;top:55%;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;background:radial-gradient(closest-side,var(--c1),transparent);opacity:.16;pointer-events:none}
.fire-on .fire-glow{animation:fglow 2.6s ease-in-out infinite alternate}
@keyframes fglow{from{opacity:.14;transform:scale(.9)}to{opacity:.36;transform:scale(1.07)}}
.spk{position:absolute;bottom:70px;width:5px;height:5px;border-radius:50%;background:var(--g2);opacity:0;z-index:2;animation:spk 2s ease-out infinite}
@keyframes spk{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-90px) scale(.2);opacity:0}}
.fire-tx{display:flex;flex-direction:column;min-width:0}
.fire-lbl{font-size:16px;color:var(--mut)}
.fire-n{font-size:66px;font-weight:700;line-height:1.05;color:var(--c1)}
.fire-tier{align-self:flex-start;margin-top:8px;font-size:13px;font-weight:500;padding:4px 12px;border-radius:20px;background:var(--bg);color:var(--c1)}
.fire-msg{font-size:17px;font-weight:500;margin:14px 0 8px;line-height:1.35}
.fire-nx{font-size:15px;margin:0 0 10px;line-height:1.4}
.fire-bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}
.fire-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--o2),var(--c1))}
.fire-st{font-size:13px;color:var(--mut);margin:12px 0 0;line-height:1.5}
.fire-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.fire-row>div{flex:1;min-width:0}
.fire-row b{display:block;font-weight:500;font-size:16px}
.fire-row span{font-size:13px;color:var(--mut)}
.fire-row em{font-style:normal;color:var(--c1);font-size:18px}
.fire-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg);flex:none;opacity:.45;font-size:18px}
.fire-ico.fire-on{opacity:1}
.fire-note{font-size:13px;color:var(--mut);margin:12px 4px 0;line-height:1.45}
@media(prefers-reduced-motion:reduce){.fire-on .flm *,.fire-on .fire-glow,.spk{animation:none!important}}
/* ===== Transisi menu: masuk & keluar yang halus ===== */
:root{--ex:cubic-bezier(.4,0,1,1)}
#bd{transition:opacity .4s var(--eo)}
/* dialog di tengah: dipusatkan dengan margin auto (bukan translateY(-50%)), jadi transform hanya untuk animasi */
#sh{top:0;bottom:0;left:16px;right:16px;margin:auto;height:-webkit-fit-content;height:fit-content;max-width:420px;max-height:80vh;border-radius:28px;padding:24px 20px;transform:translateY(22px) scale(.94);opacity:0;visibility:hidden;pointer-events:none;box-shadow:0 12px 40px #0005;transition:opacity .16s linear,transform .24s var(--ex),visibility 0s linear .24s}
body.o #sh{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:opacity .24s ease-out,transform .44s var(--eo)}
/* layar penuh: geser dari kanan, halaman di belakang ikut bergeser pelan */
#sh.fs{top:0;bottom:0;left:0;right:0;margin:0 auto;height:auto;max-width:460px;max-height:none;border-radius:0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(52px);box-shadow:none;transition:opacity .2s linear,transform .26s var(--ex),visibility 0s linear .26s}
body.o #sh.fs{transform:none;transition:opacity .28s ease-out,transform .5s var(--eo)}
main{transition:transform .5s var(--eo),opacity .4s ease}
body.o.fso main{transform:translateX(-26px);opacity:.55}
/* isi layar penuh muncul berurutan */
@keyframes shi{from{opacity:0;transform:translateY(16px)}}
#sh.shi>*:not(.nsi){animation:shi .55s var(--eo) both;animation-delay:calc(var(--i,0)*50ms + 90ms)}
/* menu titik tiga: tumbuh dari tombolnya, item muncul berurutan */
#mpop{transform-origin:top right;animation:mpIn .38s var(--eo) both}
@keyframes mpIn{from{opacity:0;transform:scale(.5,.3)}}
#mpop button{animation:mpi .34s var(--eo) both;animation-delay:calc(var(--i,0)*45ms + 80ms)}
@keyframes mpi{from{opacity:0;transform:translateY(-8px)}}
#mpop.out{animation:mpOut .17s var(--ex) forwards}
#mpop.out button{animation:none}
@keyframes mpOut{to{opacity:0;transform:scale(.92,.82)}}
/* dialog pilihan (urutkan, tema): masuk dan keluar */
#hsd{animation:hsf .22s ease-out}
#hsd .hsm{animation:hsp .42s var(--eo) both}
@keyframes hsp{from{opacity:0;transform:translateY(20px) scale(.94)}}
#hsd.out{animation:hso .18s linear forwards;pointer-events:none}
#hsd.out .hsm{animation:hspo .18s var(--ex) forwards}
@keyframes hso{to{opacity:0}}
@keyframes hspo{to{opacity:0;transform:translateY(10px) scale(.96)}}
/* layar streak: api menyala, angka naik, progres terisi, daftar muncul berurutan */
.fire-fl .flm{transform-origin:50% 100%;animation:ignite .9s var(--sp) .2s both}
@keyframes ignite{from{opacity:0;transform:translateY(16px) scale(.3)}}
.fire-tier{animation:chip .6s var(--sp) .6s both}
@keyframes chip{from{opacity:0;transform:scale(.6)}}
.fire-msg,.fire-nx,.fire-st{animation:shi .6s var(--eo) both}
.fire-msg{animation-delay:.34s}.fire-nx{animation-delay:.42s}.fire-st{animation-delay:.62s}
.fire-bar i{animation:fbar 1.1s var(--eo) .5s both}
@keyframes fbar{from{width:0}}
.fire-row{animation:shi .55s var(--eo) both;animation-delay:calc(var(--r,0)*55ms + .55s)}
@media(prefers-reduced-motion:reduce){#sh.shi>*,#mpop button,#hsd .hsm,.fire-fl .flm,.fire-tier,.fire-msg,.fire-nx,.fire-st,.fire-bar i,.fire-row{animation:none!important}main{transition:none}}
/* ===== Pengaturan bergaya iOS (hanya layar ini) ===== */

#sh.iosset .nbar{display:flex;align-items:center;height:48px;margin:0 -8px}

#sh.iosset .ltl{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:4px 0 16px}
#sh.iosset .sic{width:30px;height:30px;border-radius:7px;color:#fff;display:grid;place-items:center;flex:none}
#sh.iosset .sic svg{width:18px;height:18px}
#sh.iosset .chev{width:8px;height:8px;border:solid var(--mut);border-width:2px 2px 0 0;transform:rotate(45deg);opacity:.6;flex:none;margin-right:4px}

function pmove(e){if(LK&&LK.drag)pHit(e)}
function pup(){if(!LK||!LK.drag)return;LK.drag=false;const b=LK.buf;LK.buf=[];if(b.length<4){lkErr('Sambungkan minimal 4 titik');pdraw();return}pdraw();setTimeout(()=>lkSubmit(b.join('-')),150)}
function pk(k){if(!LK||LK.t!=='pin')return;let b=LK.buf||'';if(k==='<')b=b.slice(0,-1);else if(b.length<4)b+=k;LK.buf=b;pdraw();if(b.length===4){LK.buf='';setTimeout(()=>lkSubmit(b),120)}}
function lkSubmit(v){
 if(!LK)return;
 if(LK.m==='unlock'){if(LKH(v)===S.lock.h)lkDone();else{lkErr('Salah, coba lagi');pdraw()}return}
 if(!LK.step){LK.first=v;LK.step=1;lkRender();return}
 if(v===LK.first){S.lock={t:LK.t,h:LKH(v)};save();lkDone(true)}
 else{LK.first='';LK.step=0;lkRender();lkErr('Tidak sama, ulangi dari awal')}
}

/* ===== Tantangan mingguan & Nabung otomatis ===== */
const TC_HR=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const TCI='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
const AOI='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12a9 9 0 0 1 15.5-6.3M18 2v4h-4M6 22v-4h4"/></svg>';
const tcCfg=()=>S.tc||(S.tc={days:[],saved:false,ok:[]});
let TCF=false;
const tcWk=d=>K(A(d,-((d.getDay()+6)%7)));
const tcNm=w=>TC_HR[(w+6)%7];
const tcOrd=a=>a.slice().sort((x,y)=>((x+6)%7)-((y+6)%7));
function tcDays(){sy();const ar=S.fa||{},its=(S.items||[]).filter(x=>x.g),w0=A(T0,-((T0.getDay()+6)%7)),r=[];
 for(let i=0;i<7;i++){const d=A(w0,i),k=K(d);r.push({k,w:d.getDay(),s:!!(ar[k]||its.some(x=>(x.v||{})[k]>0)),t:k==TK,p:k<TK})}return r}
function tcOn(){const c=tcCfg();return !!(c.saved&&c.days&&c.days.length)}
function tcLive(){return tcOn()&&tcWk(T0)>=(tcCfg().st||'')}
function tcCount(){const c=tcCfg(),ds=tcDays().filter(x=>(c.days||[]).includes(x.w));return{n:ds.length,d:ds.filter(x=>x.s).length}}
function tcRun(){const ok=tcCfg().ok||[];let d=T0,n=0;if(!ok.includes(tcWk(d)))d=A(d,-7);while(ok.includes(tcWk(d))){n++;d=A(d,-7)}return n}
function tcChk(){const c=tcCfg();if(!tcLive())return;const q=tcCount(),wk=tcWk(T0);
 if(q.n&&q.d>=q.n&&!(c.ok||[]).includes(wk)){(c.ok=c.ok||[]).push(wk);save();try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}snk('🎉 Tantangan mingguan tuntas! Semua hari pilihanmu sudah menabung.')}}
function tcSub(){if(!tcOn())return'Belum dibuat';if(!tcLive())return'Mulai Senin depan';const q=tcCount();return q.d>=q.n?'Tuntas minggu ini ✓':q.d+' dari '+q.n+' hari minggu ini'}
function tcDots(){const c=tcCfg(),live=tcLive();return '<div style="display:flex;justify-content:space-between;margin:14px 0 6px">'+tcDays().map((x,i)=>{const ch=(c.days||[]).includes(x.w),bad=live&&ch&&x.p&&!x.s;
 const st=!ch?'border:1.5px dashed var(--ln);opacity:.4':x.s&&live?'background:var(--grn);color:#fff':bad?'border:1.5px solid var(--red);color:var(--red)':'border:1.5px solid '+(x.t?'var(--ac)':'var(--ln)');
 return `<div style="text-align:center;font-size:11px;color:var(--mut)"><div style="width:30px;height:30px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:15px;${st}">${ch&&x.s&&live?'✓':bad?'✕':''}</div>${TC_HR[i]}</div>`}).join('')+'</div>'}

function tcCard(){const c=tcCfg();
 if(!tcOn())return `<div class="cd" role="button" onclick="tcOpen()" style="margin:12px 0"><div class="rw"><h3 style="font-size:18px;font-weight:500;margin:0">Tantangan mingguan</h3><span class="mu">Buat ›</span></div><p class="mu" style="margin:6px 0 0">Pilih hari menabungmu, lalu selesaikan tiap minggu.</p></div>`;
 const q=tcCount();
 return `<div class="cd" role="button" onclick="tcOpen()" style="margin:12px 0"><div class="rw"><h3 style="font-size:18px;font-weight:500;margin:0">Tantangan mingguan</h3><span class="mu">${!tcLive()?'Mulai Senin depan':q.d>=q.n?'Tuntas ✓':q.d+'/'+q.n+' hari'}</span></div>${tcDots()}${tcBar()}</div>`}
function tcOpen(f){if(f!==undefined)TCF=!!f;const c=tcCfg();
 if(!tcOn()){op(`<h3>Tantangan mingguan</h3><p class="mu">Pilih hari-hari kamu mau menabung tiap minggu. Tantangan tuntas kalau semua hari pilihanmu sudah menabung. Setelah disimpan, pilihannya tidak bisa diubah, tapi bisa dihapus.</p><p class="mu" style="margin:16px 0 0">Hari tantangan:</p><div class="ch" id="tcd">${[1,2,3,4,5,6,0].map(w=>`<button data-w="${w}" onclick="this.classList.toggle('on')">${tcNm(w)}</button>`).join('')}</div><p id="tcm" class="mu" style="color:var(--red);margin:6px 0 0"></p><div class="rw" style="margin-top:12px"><button class="gh" onclick="cl()">Batal</button><button class="pb" onclick="tcSave()">Simpan</button></div>`);return}
 const q=tcCount(),run=tcRun(),tot=(c.ok||[]).length,live=tcLive();
 op(`<h3>Tantangan mingguan</h3><p class="mu">Menabung di hari ${tcOrd(c.days).map(tcNm).join(', ')} tiap minggu. Sudah disimpan, jadi tidak bisa diubah. Hapus kalau mau membuat yang baru.</p><div class="cd" style="margin:14px 0 0"><div class="rw"><b style="font-weight:500">Minggu ini</b><span class="mu">${!live?'Mulai Senin depan':q.d>=q.n?'Tuntas ✓':'Tinggal '+(q.n-q.d)+' hari lagi'}</span></div>${tcDots()}${tcBar()}</div><div class="rw" style="gap:12px;margin-top:12px"><div class="cd" style="flex:1;text-align:center;margin:0"><b style="font-size:22px">🏅 ${tot}</b><div class="mu" style="font-size:12px">Minggu tuntas</div></div><div class="cd" style="flex:1;text-align:center;margin:0"><b style="font-size:22px">🔥 ${run}</b><div class="mu" style="font-size:12px">Beruntun</div></div></div><div class="rw" style="margin-top:16px"><button class="gh" onclick="tcAsk()">Hapus</button><button class="pb" onclick="cl()">Tutup</button></div>`)}
function tcSave(){const ds=[...document.querySelectorAll('#tcd .on')].map(b=>+b.dataset.w);if(!ds.length){$('tcm').textContent='Pilih minimal satu hari.';return}
 const c=tcCfg();c.days=ds;c.saved=true;const miss=tcDays().some(x=>ds.includes(x.w)&&x.p&&!x.s);c.st=miss?tcWk(A(T0,7)):tcWk(T0);save();
 if(TCF)setRender(1);else tcOpen();snk(miss?'Tantangan disimpan · mulai Senin depan':'Tantangan disimpan');tcChk()}
function tcAsk(){op(`<h3>Hapus tantangan?</h3><p class="mu" style="text-align:center">Pilihan harinya akan dihapus. Catatan minggu yang sudah tuntas tetap ada.</p><div class="rw" style="margin-top:14px"><button class="gh" onclick="tcOpen()">Batal</button><button class="pb" onclick="tcDel()">Hapus</button></div>`)}
function tcDel(){const c=tcCfg();c.days=[];c.saved=false;delete c.st;save();if(TCF)setRender(1);else cl();snk('Tantangan dihapus')}
/* Nabung otomatis: jumlah per hari tiap tabungan dicatat sendiri di jam pilihan (hari kerja saja) */
function aoItems(){return(S.items||[]).filter(x=>x.g)}
function aoSel(a){const L=aoItems();return a.ids?L.filter(x=>a.ids.includes(x.id)):(a.on?L:[])}
function aoSub(){const a=S.ao;if(!(a&&a.on))return'Mati';const n=aoSel(a).length;return 'Aktif · '+(a.t||'20:00')+' · '+n+' tabungan'}
function aoOpen(){const a=S.ao||{};
 op(`<h3>Nabung otomatis</h3><p class="mu">Setiap hari kerja, jumlah per hari dari tiap tabunganmu dicatat otomatis di jam yang kamu pilih. Hari yang terlewat dicatat saat aplikasi dibuka lagi.</p><div class="rw" style="margin-top:12px"><b style="font-weight:500">Aktifkan</b><button type="button" id="aon" class="tgl${a.on?' on':''}" role="switch" aria-checked="${!!a.on}" aria-label="Aktifkan nabung otomatis" onclick="tg(this)"></button></div><p class="mu" style="margin:16px 0 0">Tabungan yang dicatat otomatis (boleh lebih dari satu):</p>${aoItems().length?`<div class="ch" id="aoi">${aoItems().map(x=>`<button class="${aoSel(a).some(y=>y.id==x.id)?'on':''}" data-i="${x.id}" onclick="this.classList.toggle('on')">${esc(x.g.n)}${+x.q>0?' · '+R(+x.q,x.g.cur||'IDR'):' · belum ada jumlah'}</button>`).join('')}</div>`:'<p class="mu">Belum ada tabungan. Buat tabungan dulu.</p>'}<label style="display:block;margin-top:6px">Jam pencatatan<input id="aot" type="time" value="${a.t||'20:00'}"></label><p id="aom" class="mu" style="color:var(--red);margin:6px 0 0"></p><p class="mu" style="font-size:13px">Hanya untuk tabungan yang punya jumlah per hari. Berhenti sendiri kalau targetnya tercapai. Pastikan uangnya benar-benar kamu sisihkan ya.</p><div class="rw" style="margin-top:12px"><button class="gh" onclick="cl()">Batal</button><button class="pb" onclick="aoSave()">Simpan</button></div>`)}
function aoSave(){const on=$('aon').classList.contains('on'),was=!!(S.ao&&S.ao.on),ids=[...document.querySelectorAll('#aoi .on')].map(b=>+b.dataset.i);if(on&&!ids.length){$('aom').textContent='Pilih minimal satu tabungan.';return}S.ao={on,t:$('aot').value||'20:00',ids,from:on&&!was?TK:((S.ao&&S.ao.from)||TK)};save();if(on)aoRun();setRender(1);snk(on?'Nabung otomatis aktif · tiap hari jam '+S.ao.t:'Nabung otomatis dimatikan')}
function aoRun(){const a=S.ao;if(!a||!a.on)return;refreshTK();sy();const now=new Date(),hm0=(a.t||'20:00').split(':').map(Number),h=hm0[0]||0,m=hm0[1]||0,due=now.getHours()*60+now.getMinutes()>=h*60+m;
 let from=a.from||TK;if(from>TK)return;let last=from,add=0;
 for(let d=P(from);d<=T0;d=A(d,1)){const k=K(d);if(k==TK&&!due)break;
  for(const it of S.items||[]){if(!it.g||!(+it.q>0))continue;if(a.ids&&!a.ids.includes(it.id))continue;if((it.off||[0]).includes(d.getDay()))continue;const g=it.g,st=g.s||TK;if(k<st)continue;
   const en=g.d?K(A(P(st),g.d-1)):'';if(en&&k>en)continue;const v=it.v||(it.v={}),L=it.L||(it.L={});if(v[k]!=null||(L[k]&&L[k].length))continue;
   let tot=0;for(const x in v)tot+=v[x];if(g.t&&tot>=g.t)continue;const amt=g.t?Math.min(+it.q,g.t-tot):+it.q;if(!(amt>0))continue;
   L[k]=[{a:amt,n:'Otomatis',t:new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime()}];v[k]=amt;add++}
  last=K(A(d,1))}
 a.from=last;save();if(add){render();hv();snk('Nabung otomatis: '+add+' catatan ditambahkan')}}
setInterval(aoRun,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)aoRun()});
render();hv();aoRun();
if(S.lock)lkStart();
