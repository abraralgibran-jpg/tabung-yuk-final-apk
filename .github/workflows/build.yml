name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Find Project Directory
        id: find-dir
        run: |
          SETTINGS_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | grep -v "/build/" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            GRADLEW_FILE=$(find . -type f -name "gradlew" | head -n 1)
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Folder root proyek ditemukan di: $PROJECT_DIR"

      - name: Prepare gradle.properties
        working-directory: ${{ steps.find-dir.outputs.project_dir }}
        run: |
          touch gradle.properties
          grep -q "^android.useAndroidX=true" gradle.properties || printf '\nandroid.useAndroidX=true\n' >> gradle.properties
          grep -q "^android.enableJetifier=true" gradle.properties || printf '\nandroid.enableJetifier=true\n' >> gradle.properties

      - name: Build APK
        working-directory: ${{ steps.find-dir.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew tidak ditemukan, menggunakan gradle sistem..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Hapus artifact lama
        uses: geekyeggo/delete-artifact@v5
        with:
          name: app-debug-apk
          failOnError: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          overwrite: true
          retention-days: 7
